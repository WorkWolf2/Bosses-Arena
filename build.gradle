plugins {
    id 'java'
    id "io.github.goooler.shadow" version "8.1.8"
}

group = 'com.minegolem'
version = '2.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'

        content {
            includeGroup 'org.bukkit'
            includeGroup 'org.spigotmc'
        }
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven {
        name 'papi-repo'
        url 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }

    maven {
        url 'https://jitpack.io'
    }

    maven { url "https://repo.aikar.co/content/groups/aikar/" }

    maven {
        name 'phoenix'
        url 'https://nexus.phoenixdevt.fr/repository/maven-public/'
    }

    maven { url 'https://mvn.lumine.io/repository/maven-public/' }

    maven {
        url "https://repo.oraxen.com/releases"
    }

    }

    dependencies {
        compileOnly 'org.spigotmc:spigot-api:1.18.2-R0.1-SNAPSHOT'

        implementation group: 'com.jeff-media', name: 'custom-block-data', version: '2.2.2' // CUSTOM BLOCK DATA
        compileOnly group: 'me.clip', name: 'placeholderapi', version: '2.11.6' // PLACEHOLDER API

        compileOnly "net.Indyuce:MMOCore-API:1.12.1-SNAPSHOT" // MMOCORE API
        compileOnly 'io.lumine:Mythic-Dist:5.7.2-SNAPSHOT' // MYTHICMOB API
        compileOnly 'io.lumine:MythicLib-dist:1.6.2-SNAPSHOT' // MYTHICLIB API

        compileOnly 'io.th0rgal:oraxen:1.181.0' // ORAXEN API
        compileOnly "com.github.MilkBowl:VaultAPI:1.7" // VAULT API

        implementation group: 'org.bstats', name: 'bstats-bukkit', version: '3.0.2' // BSTATS BUKKIT
        implementation group: 'org.bstats', name: 'bstats-base', version: '3.0.2' //BSTATS BASE

        implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT" // COMMAND API

        implementation 'com.github.NaTorOG:SimpleConfig:1.0.6' // MESSAGES API

        implementation "com.zaxxer:HikariCP:5.1.0"
        compileOnly "org.mariadb.jdbc:mariadb-java-client:2.7.4"

        // ADVENTURE API
        implementation "net.kyori:adventure-platform-bukkit:4.3.4"
        implementation "net.kyori:adventure-api:4.17.0"
        implementation "net.kyori:adventure-text-minimessage:4.17.0"

        implementation 'org.jetbrains:annotations:23.0.0'
        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
    }

    shadowJar {

        archiveFileName = 'BossesArena-' + project.version + '.jar'

        relocate 'com.jeff_media.customblockdata', 'com.minegolem.bossesArena.libs.customblockdata'
        relocate 'org.bstats', 'com.minegolem.bossesArena.libs.bstats'
        relocate 'org.jetbrains', 'com.minegolem.bossesArena.libs.jetbrains.annotations'
        relocate 'com.github.NaTorOG', 'com.minegolem.bossesArena.libs.configs'
        relocate 'com.zaxxer', 'com.minegolem.bossesArena.libs.hikariCP'
        relocate 'net.kyori', 'com.minegolem.bossesArena.libs.adventure'

        relocate 'co.aikar.commands', 'com.minegolem.bossesArena.libs.acf'
        relocate 'co.aikar.locales', 'com.minegolem.bossesArena.libs.locales'

        minimize()
        mergeServiceFiles()
    }

    tasks.build.dependsOn shadowJar

    def targetJavaVersion = 21
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'

        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }

    processResources {
        def props = [version: version]
        inputs.properties props
        filteringCharset 'UTF-8'
        filesMatching('plugin.yml') {
            expand props
        }
    }